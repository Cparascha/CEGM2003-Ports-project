name: LA_PORTS_ENV
channels:
  - conda-forge
  - pytorch
dependencies:
  # ---- Python ----
  - python=3.11

  # ---- Core scientific stack ----
  - numpy
  - pandas
  - scipy
  - matplotlib

  # ---- Geo / spatial ----
  - geopandas
  - shapely
  - pyproj
  - contextily
  - rasterio
  - fiona
  - gdal

  # ---- ML / clustering ----
  - scikit-learn
  - joblib
  - threadpoolctl

  # ---- Mapping / viz ----
  - folium
  - plotly

  # ---- Utilities ----
  - tqdm
  - ipython

  # ---- PyTorch (CPU only, safe) ----
  - pytorch
  - torchvision
  - torchaudio
  - cpuonly

  # ---- pip-only packages ----
  - pip
  - pip:
      - pygeohash
